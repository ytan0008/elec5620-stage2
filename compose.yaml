services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/elec5620.db
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - appdata:/data
      - uploads:/app/uploads
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  appdata:
  uploads:
